      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedCancel"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/shared/members/{member_id}/arrive-pickup:
    post:
      operationId: arriveSharedMember
      summary: Record reaching a passenger's pickup
      security:
        - bearerAuth: [driver]
      parameters:
        - $ref: "#/components/parameters/RideId"
        - {name: member_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/shared/members/{member_id}/picked-up:
    post:
      operationId: pickUpSharedMember
      summary: Record a passenger getting in
      security:
        - bearerAuth: [driver]
      parameters:
        - $ref: "#/components/parameters/RideId"
        - {name: member_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/shared/members/{member_id}/dropped-off:
    post:
      operationId: dropOffSharedMember
      summary: Record a passenger arriving
      security:
        - bearerAuth: [driver]
      parameters:
        - $ref: "#/components/parameters/RideId"
        - {name: member_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/shared/members/{member_id}/no-show:
    post:
      operationId: noShowSharedMember
      summary: Remove a passenger who never came
      security:
        - bearerAuth: [driver]
      parameters:
        - $ref: "#/components/parameters/RideId"
        - {name: member_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/methods:
    get:
      operationId: listAuthMethods
      summary: List the sign-in methods available
      security: []
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/rides/{ride_id}/notifications:
    get:
      operationId: listRideDeliveries
      summary: Show what was sent about a ride
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - $ref: "#/components/parameters/RideId"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideDeliveries"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/rides/pickup-watchdog/summary:
    get:
      operationId: getWatchdogSummary
      summary: Count rescued pickups
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - {name: hours, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 720, default: 24}}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchdogSummary"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/moderation/enforcements/metrics:
    get:
      operationId: getEnforcementMetrics
      summary: Summarize penalties
      security:
        - bearerAuth: [ops, admin]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnforcementMetrics"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/ratings/users/{user_id}/guardrails:
    get:
      operationId: getRatingGuardrail
      summary: Report whether an account has enough ratings to act on
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingGuardrail"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/verification/documents/reviews/bulk:
    post:
      operationId: reviewVerificationDocuments
      summary: Apply one decision to many documents
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkReviewRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkReviewResults"
        default:
          $ref: "#/components/responses/Problem"

components:
  parameters:
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnforcementId:
      name: enforcement_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RatingId:
      name: rating_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompensationId:
      name: compensation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
        default: 0
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      schema:
        type: string
    CallbackToken:
      name: token
      in: path
      required: true
      description: Shared secret. Safaricom cannot send custom headers.
      schema:
        type: string
    RideId:
      name: ride_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferId:
      name: offer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    # Operation scopes name the roles allowed in. No scopes means any account.
    # Reaching a route through ops or admin alone also needs an enrolled
    # authenticator. "mfa:exempt" lifts that for enrolment itself, and
    # "mfa:step-up" additionally requires a fresh X-Step-Up-Token.
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Subscription:
      type: object
      additionalProperties: false
      required: [status, amount_kes, week_start, week_end, reference, paybill_shortcode]
      properties:
        status:
          type: string
          enum: [pending, active, expired]
        amount_kes:
          type: integer
          format: int32
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        reference:
          type: string
          description: The account number to use when paying by paybill.
        paybill_shortcode:
          type: string

    SubscriptionPayment:
      type: object
      additionalProperties: false
      required: [id, channel, status, amount_kes, requested_at]
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [stk, c2b]
        status:
          type: string
          enum: [initiated, pending_callback, success, failed, cancelled, timeout, needs_review]
        amount_kes:
          type: integer
          format: int32
        receipt:
          type: string
        requested_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time

    SubscriptionPaymentList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPayment"

    MpesaCallback:
      type: object
      additionalProperties: true
      description: A Daraja callback body. Its shape is owned by Safaricom.

    MpesaAck:
      type: object
      additionalProperties: false
      required: [ResultCode, ResultDesc]
      properties:
        ResultCode:
          type: integer
          format: int32
        ResultDesc:
          type: string

    Coordinates:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    QuoteRequest:
      type: object
      additionalProperties: false
      required: [vehicle_category, pickup, dropoff]
      properties:
        vehicle_category:
          type: string
          example: motorbike
        pickup:
          $ref: "#/components/schemas/Coordinates"
        dropoff:
          $ref: "#/components/schemas/Coordinates"
        product_type:
          type: string
          enum: [solo, shared]

    Quote:
      type: object
      additionalProperties: false
      required:
        - id
        - fare_kes
        - base_fare_kes
        - discount_kes
        - surge_bps
        - distance_m
        - duration_s
        - polyline
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        fare_kes:
          type: integer
          format: int32
          description: The price the rider pays.
        base_fare_kes:
          type: integer
          format: int32
          description: The price before the discount.
        discount_kes:
          type: integer
          format: int32
        solo_fare_kes:
          type: integer
          format: int32
          description: What the trip would cost alone, on a shared quote.
        surge_bps:
          type: integer
          format: int32
          description: Demand multiplier in basis points. 10000 means no surge.
        distance_m:
          type: integer
          format: int32
        duration_s:
          type: integer
          format: int32
        polyline:
          type: string
          description: Encoded route for display.
        expires_at:
          type: string
          format: date-time

    QuoteAllRequest:
      type: object
      additionalProperties: false
      required: [pickup, dropoff]
      properties:
        pickup:
          $ref: "#/components/schemas/Coordinates"
        dropoff:
          $ref: "#/components/schemas/Coordinates"

    CategoryQuote:
      type: object
      additionalProperties: false
      required: [vehicle_category, quote]
      properties:
        vehicle_category:
          type: string
        quote:
          $ref: "#/components/schemas/Quote"

    CategoryQuoteList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CategoryQuote"

    BookRideRequest:
      type: object
      additionalProperties: false
      required: [quote_id]
      properties:
        quote_id:
          type: string
          format: uuid

    RideStatus:
      type: string
      enum:
        - searching
        - accepted
        - driver_arriving
        - arrived
        - in_progress
        - completed
        - cancelled
        - no_drivers

    PaymentMode:
      type: string
      enum: [cash_direct, mpesa_direct]

    Ride:
      type: object
      additionalProperties: false
      required: [id, status, pickup, dropoff, fare_kes, requested_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RideStatus"
        pickup:
          $ref: "#/components/schemas/Coordinates"
        dropoff:
          $ref: "#/components/schemas/Coordinates"
        fare_kes:
          type: integer
          format: int32
        requested_at:
          type: string
          format: date-time
        driver_id:
          type: string
          format: uuid
        driver_location:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: Present only while the driver is on the way or on the trip.
        payment_mode:
          $ref: "#/components/schemas/PaymentMode"
        driver:
          allOf:
            - $ref: "#/components/schemas/DriverCard"
          description: Shown to the rider while the driver is on the way or on the trip.
        rider:
          allOf:
            - $ref: "#/components/schemas/RiderCard"
          description: Shown to the driver of a solo ride while it is under way.

    DriverCard:
      type: object
      additionalProperties: false
      required: [vehicle_category, completed_rides]
      properties:
        name:
          type: string
        plate_number:
          type: string
        photo_url:
          type: string
          description: The driver's approved selfie. The link works for five minutes, so fetch it fresh from the ride.
        vehicle_category:
          type: string
        completed_rides:
          type: integer
          format: int32
        rating:
          type: number
          format: double
          description: Absent until the driver has ten rated rides, when the client shows them as new.

    RiderCard:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        rating:
          type: number
          format: double
          description: Absent until the rider has ten rated rides.

    CancelRideRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: A reason code allowed for the caller's side of the ride.
          example: rider_changed_mind

    CompleteTripRequest:
      type: object
      additionalProperties: false
      required: [payment_mode]
      properties:
        payment_mode:
          $ref: "#/components/schemas/PaymentMode"

    DriverProfile:
      type: object
      additionalProperties: false
      required: [vehicle_category, verification_status, subscription_status, is_online]
      properties:
        vehicle_category:
          type: string
        verification_status:
          type: string
          enum: [pending, approved, rejected]
        subscription_status:
          type: string
          enum: [inactive, active, grace, suspended]
        is_online:
          type: boolean

    SetDriverCategoryRequest:
      type: object
      additionalProperties: false
      required: [vehicle_category]
      properties:
        vehicle_category:
          type: string

    Offer:
      type: object
      additionalProperties: false
      required: [id, ride_id, pickup, distance_to_pickup_m, fare_kes, expires_at]
      properties:
        id:
          type: string
          format: uuid
        ride_id:
          type: string
          format: uuid
        pickup:
          $ref: "#/components/schemas/Coordinates"
        distance_to_pickup_m:
          type: integer
          format: int32
        fare_kes:
          type: integer
          format: int32
        expires_at:
          type: string
          format: date-time
        rider_rating:
          type: number
          format: double
          description: Absent for shared rides and until the rider has ten rated rides.

    OfferList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Offer"

    # staff signs in an existing ops or admin account and never grants a role.
    SignupRole:
      type: string
      enum: [rider, driver, staff]

    Role:
      type: string
      enum: [rider, driver, ops, admin]

    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone, role]
      properties:
        phone:
          type: string
          example: "0712345678"
        role:
          $ref: "#/components/schemas/SignupRole"

    OtpChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    OtpVerification:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          example: "123456"

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    Session:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_token_expires_in
        - refresh_token
        - refresh_token_expires_in
        - user_id
        - roles
      properties:
        access_token:
          type: string
        access_token_expires_in:
          type: integer
          format: int32
          description: Lifetime in seconds.
        refresh_token:
          type: string
        refresh_token_expires_in:
          type: integer
          format: int32
          description: Lifetime in seconds.
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Me:
      type: object
      additionalProperties: false
      required: [id, phone, roles]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        display_name:
          type: string

    AccountExport:
      type: object
      additionalProperties: false
      required: [generated_at, truncated, profile, rides, payments, documents, ratings_given, reports_submitted, messages_sent]
      properties:
        generated_at:
          type: string
          format: date-time
        truncated:
          type: boolean
          description: True if a list reached its limit. Support can provide the rest.
        profile:
          $ref: "#/components/schemas/ExportProfile"
        rides:

openapi: 3.0.3
info:
  title: Liddr API
  version: 0.1.0
  description: Ride-hailing and delivery API for Kenya.

# Every operation requires a session unless it opts out with `security: []`.
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Report that the process is running
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getReadiness
      summary: Report whether the instance can serve traffic
      security: []
      responses:
        "200":
          description: The instance can serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The instance is draining or cannot reach Postgres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/vehicle-categories:
    get:
      operationId: listVehicleCategories
      summary: List the vehicle categories open for booking and driver sign-up
      security: []
      responses:
        "200":
          description: Active categories in display order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleCategoryList"
        "500":
          description: The request could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Send a sign-in code to a Kenyan mobile number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "201":
          description: The code was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "400":
          description: The phone number or role is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many codes were requested.
          headers:
            Retry-After:
              required: true
              description: Seconds until another request can succeed.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The SMS provider could not take the message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Exchange a sign-in code for a session, creating the account if new
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: The code was correct.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The code is wrong or no longer valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The account cannot sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many wrong codes. Request a new one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token for new tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens. The presented refresh token is spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: The refresh token is not valid. Sign in again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The account cannot sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/logout:
    post:
      operationId: logout
      summary: End the device's session. Succeeds even if already ended.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: The session has ended.

  /v1/me:
    get:
      operationId: getMe
      summary: Return the signed-in account
      responses:
        "200":
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /v1/rides/quotes:
    post:
      operationId: createQuote
      summary: Price a trip. The quote is required to book and expires quickly.
      security:
        - bearerAuth: [rider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "201":
          description: The priced trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides:
    post:
      operationId: bookRide
      summary: Book a quoted trip. Repeating the call returns the same ride.
      security:
        - bearerAuth: [rider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRideRequest"
      responses:
        "201":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}:
    parameters:
      - $ref: "#/components/parameters/RideId"
    get:
      operationId: getRide
      summary: Return a ride to its rider or assigned driver
      security:
        - bearerAuth: [rider, driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: cancelRide
      summary: Cancel a ride as its rider or assigned driver
      security:
        - bearerAuth: [rider, driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRideRequest"
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/arriving:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: markArriving
      summary: Report that the driver is heading to pickup
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/arrived:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: markArrived
      summary: Report arrival at pickup. The driver must be near it.
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/start:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: startTrip
      summary: Start the trip
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/complete:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: completeTrip
      summary: Complete the trip at the quoted fare. The driver must be near dropoff.
      security:
        - bearerAuth: [driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTripRequest"
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/no-show:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: markNoShow
      summary: Report that the rider did not come after the waiting period
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me:
    get:
      operationId: getDriverProfile
      summary: Return the signed-in driver's profile
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfile"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setDriverCategory
      summary: Choose a vehicle category. Locked once the driver is approved.
      security:
        - bearerAuth: [driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDriverCategoryRequest"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfile"
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me/online:
    post:
      operationId: goOnline
      summary: Start receiving offers
      security:
        - bearerAuth: [driver]
      responses:
        "204":
          description: The driver is online.
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me/offline:
    post:
      operationId: goOffline
      summary: Stop receiving offers
      security:
        - bearerAuth: [driver]
      responses:
        "204":
          description: The driver is offline.
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me/location:
    post:
      operationId: updateDriverLocation
      summary: Report the driver's position. Excess pings are dropped silently.
      security:
        - bearerAuth: [driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Coordinates"
      responses:
        "204":
          description: The position was accepted or dropped as excess.
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me/offers:
    get:
      operationId: listDriverOffers
      summary: List the driver's open offers
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: Open offers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/offers/{offer_id}/accept:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      operationId: acceptOffer
      summary: Accept an offer
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/offers/{offer_id}/reject:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      operationId: rejectOffer
      summary: Reject an offer
      security:
        - bearerAuth: [driver]
      responses:
        "204":
          description: The offer was rejected.
        default:
          $ref: "#/components/responses/Problem"

  /v1/subscriptions/me:
    get:
      operationId: getSubscription
      summary: Return this week's subscription and how to pay it
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        default:
          $ref: "#/components/responses/Problem"

  /v1/subscriptions/me/payments:
    get:
      operationId: listSubscriptionPayments
      summary: List recent subscription payments
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPaymentList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/subscriptions/pay:
    post:
      operationId: paySubscription
      summary: Send an M-Pesa prompt for this week to the driver's phone
      security:
        - bearerAuth: [driver]
      responses:
        "202":
          description: The prompt was sent or is being confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPayment"
        default:
          $ref: "#/components/responses/Problem"

  /v1/webhooks/mpesa/{token}/stk:
    parameters:
      - $ref: "#/components/parameters/CallbackToken"
    post:
      operationId: mpesaStkCallback
      summary: Receive an STK push result from Safaricom
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaCallback"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpesaAck"
        default:
          $ref: "#/components/responses/Problem"

  /v1/webhooks/mpesa/{token}/c2b/validation:
    parameters:
      - $ref: "#/components/parameters/CallbackToken"
    post:
      operationId: mpesaC2bValidation
      summary: Answer Safaricom's paybill validation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaCallback"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpesaAck"
        default:
          $ref: "#/components/responses/Problem"

  /v1/webhooks/mpesa/{token}/c2b/confirmation:
    parameters:
      - $ref: "#/components/parameters/CallbackToken"
    post:
      operationId: mpesaC2bConfirmation
      summary: Receive a paybill payment from Safaricom
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaCallback"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpesaAck"
        default:
          $ref: "#/components/responses/Problem"

components:
  parameters:
    CallbackToken:
      name: token
      in: path
      required: true
      description: Shared secret. Safaricom cannot send custom headers.
      schema:
        type: string
    RideId:
      name: ride_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferId:
      name: offer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    # Operation scopes name the roles allowed in. No scopes means any account.
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Subscription:
      type: object
      additionalProperties: false
      required: [status, amount_kes, week_start, week_end, reference, paybill_shortcode]
      properties:
        status:
          type: string
          enum: [pending, active, expired]
        amount_kes:
          type: integer
          format: int32
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        reference:
          type: string
          description: The account number to use when paying by paybill.
        paybill_shortcode:
          type: string

    SubscriptionPayment:
      type: object
      additionalProperties: false
      required: [id, channel, status, amount_kes, requested_at]
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [stk, c2b]
        status:
          type: string
          enum: [initiated, pending_callback, success, failed, cancelled, timeout, needs_review]
        amount_kes:
          type: integer
          format: int32
        receipt:
          type: string
        requested_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time

    SubscriptionPaymentList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPayment"

    MpesaCallback:
      type: object
      additionalProperties: true
      description: A Daraja callback body. Its shape is owned by Safaricom.

    MpesaAck:
      type: object
      additionalProperties: false
      required: [ResultCode, ResultDesc]
      properties:
        ResultCode:
          type: integer
          format: int32
        ResultDesc:
          type: string

    Coordinates:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    QuoteRequest:
      type: object
      additionalProperties: false
      required: [vehicle_category, pickup, dropoff]
      properties:
        vehicle_category:
          type: string
          example: motorbike
        pickup:
          $ref: "#/components/schemas/Coordinates"
        dropoff:
          $ref: "#/components/schemas/Coordinates"

    Quote:
      type: object
      additionalProperties: false
      required:
        - id
        - fare_kes
        - base_fare_kes
        - discount_kes
        - surge_bps
        - distance_m
        - duration_s
        - polyline
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        fare_kes:
          type: integer
          format: int32
          description: The price the rider pays.
        base_fare_kes:
          type: integer
          format: int32
          description: The price before the discount.
        discount_kes:
          type: integer
          format: int32
        surge_bps:
          type: integer
          format: int32
          description: Demand multiplier in basis points. 10000 means no surge.
        distance_m:
          type: integer
          format: int32
        duration_s:
          type: integer
          format: int32
        polyline:
          type: string
          description: Encoded route for display.
        expires_at:
          type: string
          format: date-time

    BookRideRequest:
      type: object
      additionalProperties: false
      required: [quote_id]
      properties:
        quote_id:
          type: string
          format: uuid

    RideStatus:
      type: string
      enum:
        - searching
        - accepted
        - driver_arriving
        - arrived
        - in_progress
        - completed
        - cancelled
        - no_drivers

    PaymentMode:
      type: string
      enum: [cash_direct, mpesa_direct]

    Ride:
      type: object
      additionalProperties: false
      required: [id, status, pickup, dropoff, fare_kes, requested_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RideStatus"
        pickup:
          $ref: "#/components/schemas/Coordinates"
        dropoff:
          $ref: "#/components/schemas/Coordinates"
        fare_kes:
          type: integer
          format: int32
        requested_at:
          type: string
          format: date-time
        driver_id:
          type: string
          format: uuid
        driver_location:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: Present only while the driver is on the way or on the trip.
        payment_mode:
          $ref: "#/components/schemas/PaymentMode"

    CancelRideRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: A reason code allowed for the caller's side of the ride.
          example: rider_changed_mind

    CompleteTripRequest:
      type: object
      additionalProperties: false
      required: [payment_mode]
      properties:
        payment_mode:
          $ref: "#/components/schemas/PaymentMode"

    DriverProfile:
      type: object
      additionalProperties: false
      required: [vehicle_category, verification_status, subscription_status, is_online]
      properties:
        vehicle_category:
          type: string
        verification_status:
          type: string
          enum: [pending, approved, rejected]
        subscription_status:
          type: string
          enum: [inactive, active, grace, suspended]
        is_online:
          type: boolean

    SetDriverCategoryRequest:
      type: object
      additionalProperties: false
      required: [vehicle_category]
      properties:
        vehicle_category:
          type: string

    Offer:
      type: object
      additionalProperties: false
      required: [id, ride_id, pickup, distance_to_pickup_m, fare_kes, expires_at]
      properties:
        id:
          type: string
          format: uuid
        ride_id:
          type: string
          format: uuid
        pickup:
          $ref: "#/components/schemas/Coordinates"
        distance_to_pickup_m:
          type: integer
          format: int32
        fare_kes:
          type: integer
          format: int32
        expires_at:
          type: string
          format: date-time

    OfferList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Offer"

    SignupRole:
      type: string
      enum: [rider, driver]

    Role:
      type: string
      enum: [rider, driver, ops, admin]

    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone, role]
      properties:
        phone:
          type: string
          example: "0712345678"
        role:
          $ref: "#/components/schemas/SignupRole"

    OtpChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    OtpVerification:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          example: "123456"

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    Session:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_token_expires_in
        - refresh_token
        - refresh_token_expires_in
        - user_id
        - roles
      properties:
        access_token:
          type: string
        access_token_expires_in:
          type: integer
          format: int32
          description: Lifetime in seconds.
        refresh_token:
          type: string
        refresh_token_expires_in:
          type: integer
          format: int32
          description: Lifetime in seconds.
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Me:
      type: object
      additionalProperties: false
      required: [id, phone, roles]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    VehicleCategory:
      type: object
      additionalProperties: false
      required: [slug, label, capacity, weekly_subscription_kes]
      properties:
        slug:
          type: string
          example: motorbike
        label:
          type: string
          example: Motorbike
        capacity:
          type: integer
          format: int32
          minimum: 0
          description: Passenger seats. Zero for package delivery.
        weekly_subscription_kes:
          type: integer
          format: int32
          minimum: 0
          description: Weekly driver subscription in whole Kenyan shillings.

    VehicleCategoryList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VehicleCategory"

    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: INTERNAL_ERROR
        message:
          type: string
          description: Safe message for display.
        request_id:
          type: string
          description: Quote this when contacting support.

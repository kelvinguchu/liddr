        - {name: checkout_request_id, in: path, required: true, schema: {type: string, maxLength: 100}}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetail"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/shared:
    get:
      operationId: getSharedRide
      summary: Show a shared ride to one of its parties
      security:
        - bearerAuth: [rider, driver]
      parameters:
        - $ref: "#/components/parameters/RideId"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedRide"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/shared/members/{member_id}/cancel:
    post:

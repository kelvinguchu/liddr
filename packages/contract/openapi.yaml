        - {name: change_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/destination-changes/{change_id}/reject:
    post:
      operationId: rejectDestinationChange
      summary: Decline a new destination
      security:
        - bearerAuth: [driver]
      parameters:
        - $ref: "#/components/parameters/RideId"
        - {name: change_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationRejection"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/history:
    get:
      operationId: listRideHistory
      summary: List past and current trips
      security:
        - bearerAuth: [rider, driver]
      parameters:
        - {name: as, in: query, required: true, schema: {type: string, enum: [rider, driver]}}
        - {name: category, in: query, required: false, schema: {type: string}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideHistory"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/events:
    get:
      operationId: listRideEvents
      summary: List the steps of a ride
      security:
        - bearerAuth: [rider, driver]
      parameters:
        - $ref: "#/components/parameters/RideId"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideTimeline"
        default:

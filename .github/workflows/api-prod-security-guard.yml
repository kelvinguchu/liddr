name: API Prod Security Guard

on:
  pull_request:
    paths:
      - "legacy/api/**"
      - ".github/workflows/api-prod-security-guard.yml"
  push:
    branches:
      - main
    paths:
      - "legacy/api/**"
      - ".github/workflows/api-prod-security-guard.yml"

jobs:
  prod-security-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            legacy/api/deps
            legacy/api/_build
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('legacy/api/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-prod-

      - name: Install prod deps
        env:
          MIX_ENV: prod
        run: mix deps.get --only prod

      - name: Run production docs guard
        env:
          MIX_ENV: prod
        run: mix liddr.security.prod_guard

name: liddr

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - ./api/.env
    environment:
      MIX_ENV: prod
      PHX_SERVER: "true"
      PORT: "4000"
      PHX_HOST: localhost
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/liddr-488911-11e0721e169d.json
      MALWARE_SCAN_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OCR_ENABLED: "true"
      OCR_PDF_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - ./secrets/liddr-488911-11e0721e169d.json:/run/secrets/liddr-488911-11e0721e169d.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - liddr_net

  clamav:
    image: clamav/clamav:1.5.1-27
    restart: unless-stopped
    networks:
      - liddr_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17.7-alpine3.23
    env_file:
      - ./api/.env
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - liddr_net

  redis:
    image: redis:7.2-alpine
    env_file:
      - ./api/.env
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - liddr_net

volumes:
  postgres_data:
  redis_data:

networks:
  liddr_net:
    driver: bridge

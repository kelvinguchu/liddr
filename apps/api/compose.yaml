# Local Postgres and Redis for development and integration tests. Data is
# discarded on `docker compose down`. Credentials come from POSTGRES_* and
# REDIS_PASSWORD in .env (read by Compose from this folder) and default to
# liddr, which the Makefile's TEST_DATABASE_URL expects. Both listen on loopback
# ports chosen not to clash with other projects' defaults.
name: liddr-api-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liddr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liddr}
      POSTGRES_DB: ${POSTGRES_DB:-liddr}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Nothing in the API reads Redis yet; it is here for when something does
  # (AGENTS.md: choose and record a client before first use).
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-liddr}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-liddr}

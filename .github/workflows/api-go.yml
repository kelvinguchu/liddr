name: Go API

on:
  pull_request:
    paths: &paths
      - apps/api/**
      - packages/contract/**
      - go.work
      - .github/workflows/api-go.yml
  push:
    branches: [main]
    paths: *paths
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: liddr
          POSTGRES_PASSWORD: liddr
          POSTGRES_DB: liddr
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U liddr -d liddr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: make install-lint
      - run: make generated-check
      - run: make check

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vuln

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrityStanding"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/rides/integrity/users/{user_id}:
    get:
      operationId: getUserIntegrity
      summary: Report one account's recent strikes
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrityDetail"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/email/request:
    post:
      operationId: requestEmailOtp
      summary: Send a sign-in code to an email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpRequest"
      responses:
        "201":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/email/verify:
    post:
      operationId: verifyEmailOtp
      summary: Exchange an email code for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      summary: Exchange a Google ID token for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignIn"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/subscriptions/drivers/{user_id}:
    get:
      operationId: getDriverSubscriptionForOps

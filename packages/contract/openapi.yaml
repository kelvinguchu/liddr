openapi: 3.0.3
info:
  title: Liddr API
  version: 0.1.0
  description: Ride-hailing and delivery API for Kenya.

# Every operation requires a session unless it opts out with `security: []`.
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Report that the process is running
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getReadiness
      summary: Report whether the instance can serve traffic
      security: []
      responses:
        "200":
          description: The instance can serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The instance is draining or cannot reach Postgres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/vehicle-categories:
    get:
      operationId: listVehicleCategories
      summary: List the vehicle categories open for booking and driver sign-up
      security: []
      responses:
        "200":
          description: Active categories in display order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleCategoryList"
        "500":
          description: The request could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Send a sign-in code to a Kenyan mobile number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "201":
          description: The code was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "400":
          description: The phone number or role is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many codes were requested.
          headers:
            Retry-After:
              required: true
              description: Seconds until another request can succeed.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The SMS provider could not take the message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Exchange a sign-in code for a session, creating the account if new
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: The code was correct.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The code is wrong or no longer valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The account cannot sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many wrong codes. Request a new one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token for new tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens. The presented refresh token is spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: The refresh token is not valid. Sign in again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The account cannot sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/logout:
    post:
      operationId: logout
      summary: End the device's session. Succeeds even if already ended.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: The session has ended.

  /v1/me:
    get:
      operationId: getMe
      summary: Return the signed-in account
      responses:
        "200":
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /v1/rides/quotes:
    post:
      operationId: createQuote
      summary: Price a trip. The quote is required to book and expires quickly.
      security:
        - bearerAuth: [rider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "201":
          description: The priced trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides:
    post:
      operationId: bookRide
      summary: Book a quoted trip. Repeating the call returns the same ride.
      security:
        - bearerAuth: [rider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRideRequest"
      responses:
        "201":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}:
    parameters:
      - $ref: "#/components/parameters/RideId"
    get:
      operationId: getRide
      summary: Return a ride to its rider or assigned driver
      security:
        - bearerAuth: [rider, driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: cancelRide
      summary: Cancel a ride as its rider or assigned driver
      security:
        - bearerAuth: [rider, driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRideRequest"
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/arriving:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: markArriving
      summary: Report that the driver is heading to pickup
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/arrived:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: markArrived
      summary: Report arrival at pickup. The driver must be near it.
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/start:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: startTrip
      summary: Start the trip
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/complete:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: completeTrip
      summary: Complete the trip at the quoted fare. The driver must be near dropoff.
      security:
        - bearerAuth: [driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTripRequest"
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/no-show:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      operationId: markNoShow
      summary: Report that the rider did not come after the waiting period
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me:
    get:
      operationId: getDriverProfile
      summary: Return the signed-in driver's profile
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfile"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setDriverCategory
      summary: Choose a vehicle category. Locked once the driver is approved.
      security:
        - bearerAuth: [driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDriverCategoryRequest"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfile"
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me/online:
    post:
      operationId: goOnline
      summary: Start receiving offers
      security:
        - bearerAuth: [driver]
      responses:
        "204":
          description: The driver is online.
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me/offline:
    post:
      operationId: goOffline
      summary: Stop receiving offers
      security:
        - bearerAuth: [driver]
      responses:
        "204":
          description: The driver is offline.
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me/location:
    post:
      operationId: updateDriverLocation
      summary: Report the driver's position. Excess pings are dropped silently.
      security:
        - bearerAuth: [driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Coordinates"
      responses:
        "204":
          description: The position was accepted or dropped as excess.
        default:
          $ref: "#/components/responses/Problem"

  /v1/drivers/me/offers:
    get:
      operationId: listDriverOffers
      summary: List the driver's open offers
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: Open offers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/offers/{offer_id}/accept:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      operationId: acceptOffer
      summary: Accept an offer
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The ride.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        default:
          $ref: "#/components/responses/Problem"

  /v1/offers/{offer_id}/reject:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      operationId: rejectOffer
      summary: Reject an offer
      security:
        - bearerAuth: [driver]
      responses:
        "204":
          description: The offer was rejected.
        default:
          $ref: "#/components/responses/Problem"

  /v1/subscriptions/me:
    get:
      operationId: getSubscription
      summary: Return this week's subscription and how to pay it
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        default:
          $ref: "#/components/responses/Problem"

  /v1/subscriptions/me/payments:
    get:
      operationId: listSubscriptionPayments
      summary: List recent subscription payments
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPaymentList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/subscriptions/pay:
    post:
      operationId: paySubscription
      summary: Send an M-Pesa prompt for this week to the driver's phone
      security:
        - bearerAuth: [driver]
      responses:
        "202":
          description: The prompt was sent or is being confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPayment"
        default:
          $ref: "#/components/responses/Problem"

  /v1/webhooks/mpesa/{token}/stk:
    parameters:
      - $ref: "#/components/parameters/CallbackToken"
    post:
      operationId: mpesaStkCallback
      summary: Receive an STK push result from Safaricom
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaCallback"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpesaAck"
        default:
          $ref: "#/components/responses/Problem"

  /v1/webhooks/mpesa/{token}/c2b/validation:
    parameters:
      - $ref: "#/components/parameters/CallbackToken"
    post:
      operationId: mpesaC2bValidation
      summary: Answer Safaricom's paybill validation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaCallback"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpesaAck"
        default:
          $ref: "#/components/responses/Problem"

  /v1/webhooks/mpesa/{token}/c2b/confirmation:
    parameters:
      - $ref: "#/components/parameters/CallbackToken"
    post:
      operationId: mpesaC2bConfirmation
      summary: Receive a paybill payment from Safaricom
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaCallback"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpesaAck"
        default:
          $ref: "#/components/responses/Problem"

  /v1/realtime:
    get:
      operationId: openRealtime
      summary: Open a WebSocket of live updates for the signed-in account
      description: |
        The server sends JSON text frames and accepts none. Each has a `type`:
        `ride.status` (`ride_id`, `status`), `offer.created` (`offer_id`, `ride_id`),
        `offer.closed` (`offer_id`), `driver.location` (`ride_id`, `lat`, `lng`) and
        `resync`, which means updates may have been missed and state should be fetched.
        The socket closes when the access token expires, so reconnect after refreshing.
      responses:
        "101":
          description: Switching to the WebSocket protocol.
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/mfa/totp/setup:
    post:
      operationId: beginTotpSetup
      summary: Start enrolling an authenticator app
      description: |
        A first enrolment needs a sign-in from the last 15 minutes. Replacing an
        authenticator needs a step-up token from the current one.
      security:
        - bearerAuth: [ops, admin, "mfa:exempt"]
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      responses:
        "201":
          description: Show the secret to the user once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/mfa/totp/confirm:
    post:
      operationId: confirmTotpSetup
      summary: Activate an authenticator with a code from it
      security:
        - bearerAuth: [ops, admin, "mfa:exempt"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "204":
          description: The authenticator is active.
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/step-up:
    post:
      operationId: verifyStepUp
      summary: Exchange an authenticator code for a short-lived step-up token
      security:
        - bearerAuth: [ops, admin, "mfa:exempt"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "200":
          description: Send this token as X-Step-Up-Token on high-risk actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUpGrant"
        default:
          $ref: "#/components/responses/Problem"

  /v1/verification/applications:
    post:
      operationId: startVerification
      summary: Open a verification application, or return the open one
      security:
        - bearerAuth: [driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartVerificationRequest"
      responses:
        "201":
          description: The open application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationApplication"
        default:
          $ref: "#/components/responses/Problem"

  /v1/verification/uploads:
    post:
      operationId: prepareVerificationUpload
      summary: Get a signed URL to upload one document
      security:
        - bearerAuth: [driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareUploadRequest"
      responses:
        "201":
          description: PUT the file to upload_url with exactly these headers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationUpload"
        default:
          $ref: "#/components/responses/Problem"

  /v1/verification/documents:
    post:
      operationId: submitVerificationDocument
      summary: Submit an uploaded file for checking
      security:
        - bearerAuth: [driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDocumentRequest"
      responses:
        "201":
          description: The document, now waiting for its safety scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDocument"
        default:
          $ref: "#/components/responses/Problem"

  /v1/verification/status:
    get:
      operationId: getVerificationStatus
      summary: Report the driver's verification progress
      security:
        - bearerAuth: [driver]
      responses:
        "200":
          description: Current progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/verification/applications:
    get:
      operationId: listVerificationApplications
      summary: List applications in one status, oldest first
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [pending, under_review, approved, rejected, resubmission_required, suspended]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of the queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationQueue"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/verification/applications/{application_id}:
    get:
      operationId: getVerificationApplication
      summary: Load an application with the driver's current documents
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationApplicationDetail"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/verification/applications/{application_id}/review:
    post:
      operationId: reviewVerificationApplication
      summary: Make the final decision on an application
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "204":
          description: The decision was recorded.
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/verification/documents/{document_id}/review:
    post:
      operationId: reviewVerificationDocument
      summary: Decide on one document
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "204":
          description: The decision was recorded.
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/verification/documents/{document_id}/download:
    post:
      operationId: downloadVerificationDocument
      summary: Get a five-minute link to a document's file
      description: A POST because every request is written to the audit trail.
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: A signed link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedDownload"
        default:
          $ref: "#/components/responses/Problem"

  /v1/notifications:
    get:
      operationId: listNotifications
      summary: List the signed-in user's notifications, newest first
      security:
        - bearerAuth: [rider, driver]
      parameters:
        - name: include_acked
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/notifications/summary:
    get:
      operationId: getNotificationSummary
      summary: Count unread notifications
      security:
        - bearerAuth: [rider, driver]
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSummary"
        default:
          $ref: "#/components/responses/Problem"

  /v1/notifications/{notification_id}/ack:
    post:
      operationId: ackNotification
      summary: Mark a notification read
      security:
        - bearerAuth: [rider, driver]
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Marked read.
        default:
          $ref: "#/components/responses/Problem"

  /v1/push-tokens:
    put:
      operationId: registerPushToken
      summary: Register this device for push notifications
      security:
        - bearerAuth: [rider, driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegistration"
      responses:
        "204":
          description: Registered.
        default:
          $ref: "#/components/responses/Problem"

  /v1/push-tokens/revoke:
    post:
      operationId: revokePushToken
      summary: Stop push notifications to this device
      security:
        - bearerAuth: [rider, driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRevocation"
      responses:
        "204":
          description: Revoked, or already gone.
        default:
          $ref: "#/components/responses/Problem"

  /v1/reports/categories:
    get:
      operationId: listReportCategories
      summary: List what can be reported
      security:
        - bearerAuth: [rider, driver]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCategoryList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/reports:
    post:
      operationId: submitReport
      summary: Report the other person on a ride
      security:
        - bearerAuth: [rider, driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportSubmission"
      responses:
        "201":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiledCase"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/moderation/reports:
    get:
      operationId: listReports
      summary: List reports in one status, most severe first
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - {name: status, in: query, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/moderation/reports/{report_id}:
    get:
      operationId: getReport
      summary: Load one report including its text
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/moderation/reports/{report_id}/triage:
    post:
      operationId: triageReport
      summary: Claim a report for review
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageRequest"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/moderation/reports/{report_id}/review:
    post:
      operationId: reviewReport
      summary: Rule on a report and apply any penalty
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportReviewRequest"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/moderation/enforcements:
    get:
      operationId: listEnforcements
      summary: List penalties in one status
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - {name: status, in: query, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnforcementList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      operationId: applyEnforcement
      summary: Apply a penalty directly
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnforcementRequest"
      responses:
        "201":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enforcement"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/moderation/enforcements/{enforcement_id}/lift:
    post:
      operationId: liftEnforcement
      summary: End a penalty early
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      parameters:
        - $ref: "#/components/parameters/EnforcementId"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/ratings/pending:
    get:
      operationId: listPendingRatings
      summary: List ratings the user can still give
      security:
        - bearerAuth: [rider, driver]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingRatingList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/rate:
    post:
      operationId: rateRide
      summary: Rate the other person on a completed ride
      security:
        - bearerAuth: [rider, driver]
      parameters:
        - $ref: "#/components/parameters/RideId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingSubmission"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/rides/{ride_id}/rate/skip:
    post:
      operationId: skipRating
      summary: Decline to rate
      security:
        - bearerAuth: [rider, driver]
      parameters:
        - $ref: "#/components/parameters/RideId"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/ratings:
    get:
      operationId: listRatings
      summary: List ratings
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - {name: rated_user_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: excluded_only, in: query, required: false, schema: {type: boolean, default: false}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/ratings/{rating_id}/nullify:
    post:
      operationId: nullifyRating
      summary: Remove a rating from the score
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      parameters:
        - $ref: "#/components/parameters/RatingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NullifyRequest"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/ratings/{rating_id}/reinstate:
    post:
      operationId: reinstateRating
      summary: Return a rating to the score
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      parameters:
        - $ref: "#/components/parameters/RatingId"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/disputes:
    post:
      operationId: submitDispute
      summary: Raise a dispute about a ride
      security:
        - bearerAuth: [rider, driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeSubmission"
      responses:
        "201":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiledCase"
        default:
          $ref: "#/components/responses/Problem"

  /v1/disputes/me:
    get:
      operationId: listMyDisputes
      summary: List disputes this account may see
      security:
        - bearerAuth: [rider, driver]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDisputeList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/disputes/me/compensations:
    get:
      operationId: listMyCompensations
      summary: List compensation owed to this account
      security:
        - bearerAuth: [rider, driver]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/disputes:
    get:
      operationId: listDisputes
      summary: List disputes in one status
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - {name: status, in: query, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeCaseList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/disputes/{report_id}/resolve:
    post:
      operationId: resolveDispute
      summary: Rule on a dispute
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeResolution"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/disputes/compensations:
    get:
      operationId: listCompensations
      summary: List compensation in one status
      security:
        - bearerAuth: [ops, admin]
      parameters:
        - {name: status, in: query, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/disputes/compensations/{compensation_id}/mark-paid:
    post:
      operationId: markCompensationPaid
      summary: Record that compensation was paid
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      parameters:
        - $ref: "#/components/parameters/CompensationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkPaidRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compensation"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ops/disputes/compensations/{compensation_id}/cancel:
    post:
      operationId: cancelCompensation
      summary: Withdraw approved compensation
      security:
        - bearerAuth: [ops, admin, "mfa:step-up"]
      parameters:
        - $ref: "#/components/parameters/CompensationId"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compensation"
        default:
          $ref: "#/components/responses/Problem"

components:
  parameters:
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnforcementId:
      name: enforcement_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RatingId:
      name: rating_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompensationId:
      name: compensation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
        default: 0
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      schema:
        type: string
    CallbackToken:
      name: token
      in: path
      required: true
      description: Shared secret. Safaricom cannot send custom headers.
      schema:
        type: string
    RideId:
      name: ride_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferId:
      name: offer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    # Operation scopes name the roles allowed in. No scopes means any account.
    # Reaching a route through ops or admin alone also needs an enrolled
    # authenticator. "mfa:exempt" lifts that for enrolment itself, and
    # "mfa:step-up" additionally requires a fresh X-Step-Up-Token.
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Subscription:
      type: object
      additionalProperties: false
      required: [status, amount_kes, week_start, week_end, reference, paybill_shortcode]
      properties:
        status:
          type: string
          enum: [pending, active, expired]
        amount_kes:
          type: integer
          format: int32
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        reference:
          type: string
          description: The account number to use when paying by paybill.
        paybill_shortcode:
          type: string

    SubscriptionPayment:
      type: object
      additionalProperties: false
      required: [id, channel, status, amount_kes, requested_at]
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [stk, c2b]
        status:
          type: string
          enum: [initiated, pending_callback, success, failed, cancelled, timeout, needs_review]
        amount_kes:
          type: integer
          format: int32
        receipt:
          type: string
        requested_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time

    SubscriptionPaymentList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPayment"

    MpesaCallback:
      type: object
      additionalProperties: true
      description: A Daraja callback body. Its shape is owned by Safaricom.

    MpesaAck:
      type: object
      additionalProperties: false
      required: [ResultCode, ResultDesc]
      properties:
        ResultCode:
          type: integer
          format: int32
        ResultDesc:
          type: string

    Coordinates:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    QuoteRequest:
      type: object
      additionalProperties: false
      required: [vehicle_category, pickup, dropoff]
      properties:
        vehicle_category:
          type: string
          example: motorbike
        pickup:
          $ref: "#/components/schemas/Coordinates"
        dropoff:
          $ref: "#/components/schemas/Coordinates"

    Quote:
      type: object
      additionalProperties: false
      required:
        - id
        - fare_kes
        - base_fare_kes
        - discount_kes
        - surge_bps
        - distance_m
        - duration_s
        - polyline
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        fare_kes:
          type: integer
          format: int32
          description: The price the rider pays.
        base_fare_kes:
          type: integer
          format: int32
          description: The price before the discount.
        discount_kes:
          type: integer
          format: int32
        surge_bps:
          type: integer
          format: int32
          description: Demand multiplier in basis points. 10000 means no surge.
        distance_m:
          type: integer
          format: int32
        duration_s:
          type: integer
          format: int32
        polyline:
          type: string
          description: Encoded route for display.
        expires_at:
          type: string
          format: date-time

    BookRideRequest:
      type: object
      additionalProperties: false
      required: [quote_id]
      properties:
        quote_id:
          type: string
          format: uuid

    RideStatus:
      type: string
      enum:
        - searching
        - accepted
        - driver_arriving
        - arrived
        - in_progress
        - completed
        - cancelled
        - no_drivers

    PaymentMode:
      type: string
      enum: [cash_direct, mpesa_direct]

    Ride:
      type: object
      additionalProperties: false
      required: [id, status, pickup, dropoff, fare_kes, requested_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RideStatus"
        pickup:
          $ref: "#/components/schemas/Coordinates"
        dropoff:
          $ref: "#/components/schemas/Coordinates"
        fare_kes:
          type: integer
          format: int32
        requested_at:
          type: string
          format: date-time
        driver_id:
          type: string
          format: uuid
        driver_location:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: Present only while the driver is on the way or on the trip.
        payment_mode:
          $ref: "#/components/schemas/PaymentMode"

    CancelRideRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: A reason code allowed for the caller's side of the ride.
          example: rider_changed_mind

    CompleteTripRequest:
      type: object
      additionalProperties: false
      required: [payment_mode]
      properties:
        payment_mode:
          $ref: "#/components/schemas/PaymentMode"

    DriverProfile:
      type: object
      additionalProperties: false
      required: [vehicle_category, verification_status, subscription_status, is_online]
      properties:
        vehicle_category:
          type: string
        verification_status:
          type: string
          enum: [pending, approved, rejected]
        subscription_status:
          type: string
          enum: [inactive, active, grace, suspended]
        is_online:
          type: boolean

    SetDriverCategoryRequest:
      type: object
      additionalProperties: false
      required: [vehicle_category]
      properties:
        vehicle_category:
          type: string

    Offer:
      type: object
      additionalProperties: false
      required: [id, ride_id, pickup, distance_to_pickup_m, fare_kes, expires_at]
      properties:
        id:
          type: string
          format: uuid
        ride_id:
          type: string
          format: uuid
        pickup:
          $ref: "#/components/schemas/Coordinates"
        distance_to_pickup_m:
          type: integer
          format: int32
        fare_kes:
          type: integer
          format: int32
        expires_at:
          type: string
          format: date-time

    OfferList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Offer"

    # staff signs in an existing ops or admin account and never grants a role.
    SignupRole:
      type: string
      enum: [rider, driver, staff]

    Role:
      type: string
      enum: [rider, driver, ops, admin]

    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone, role]
      properties:
        phone:
          type: string
          example: "0712345678"
        role:
          $ref: "#/components/schemas/SignupRole"

    OtpChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    OtpVerification:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          example: "123456"

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    Session:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_token_expires_in
        - refresh_token
        - refresh_token_expires_in
        - user_id
        - roles
      properties:
        access_token:
          type: string
        access_token_expires_in:
          type: integer
          format: int32
          description: Lifetime in seconds.
        refresh_token:
          type: string
        refresh_token_expires_in:
          type: integer
          format: int32
          description: Lifetime in seconds.
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Me:
      type: object
      additionalProperties: false
      required: [id, phone, roles]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    VehicleCategory:
      type: object
      additionalProperties: false
      required: [slug, label, capacity, weekly_subscription_kes]
      properties:
        slug:
          type: string
          example: motorbike
        label:
          type: string
          example: Motorbike
        capacity:
          type: integer
          format: int32
          minimum: 0
          description: Passenger seats. Zero for package delivery.
        weekly_subscription_kes:
          type: integer
          format: int32
          minimum: 0
          description: Weekly driver subscription in whole Kenyan shillings.

    VehicleCategoryList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VehicleCategory"

    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: INTERNAL_ERROR
        message:
          type: string
          description: Safe message for display.
        request_id:
          type: string
          description: Quote this when contacting support.

    TotpSetup:
      type: object
      additionalProperties: false
      required: [secret, otpauth_uri, expires_at]
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
        expires_at:
          type: string
          format: date-time

    TotpCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'

    StepUpGrant:
      type: object
      additionalProperties: false
      required: [step_up_token, expires_in]
      properties:
        step_up_token:
          type: string
        expires_in:
          type: integer
          format: int32

    StartVerificationRequest:
      type: object
      additionalProperties: false
      required: [plate_number]
      properties:
        plate_number:
          type: string
          example: KMFB 123A

    PrepareUploadRequest:
      type: object
      additionalProperties: false
      required: [document_type, content_type, size_bytes]
      properties:
        document_type:
          type: string
        content_type:
          type: string
